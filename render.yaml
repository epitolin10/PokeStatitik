services:
  - type: web
    name: pokestatitik
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: dev
      - key: APP_DEBUG
        value: 1
      - key: APP_SECRET
        generateValue: true
      # Set manually in the Render dashboard: your PostgreSQL connection
      # string, e.g.
      # postgresql://user:password@host:5432/database?serverVersion=15.0.0&charset=utf8&sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: MAILER_DSN
        value: null://null
      - key: MESSENGER_TRANSPORT_DSN
        value: doctrine://default?auto_setup=0
